mode: rule
external-controller: 127.0.0.1:9090
external-ui: ./metacubexd
allow-lan: false
log-level: warning
ipv6: true
keep-alive-idle: 15
keep-alive-interval: 10
disable-keep-alive: false
unified-delay: true
tcp-concurrent: true
geodata-loader: memconservative
find-process-mode: off
geo-auto-update: true
geo-update-interval: 24
etag-support: true
geodata-mode: true
geox-url:
  geoip: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
  geosite: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
profile:
  store-selected: false
  # 储存 API 对策略组的选择，以供下次启动时使用
  store-fake-ip: true
  # 储存 fakeip 映射表，域名再次发生连接时，使用原有映射地址

tun:
  enable: true
  stack: "gvisor"
  device: "tun0"
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  include-package:
    - "a.forevergreat.atoolbox"
    - "com.google.android.apps.authenticator2"
    - "com.radolyn.ayugram"
    - "com.x8bit.bitwarden"
    - "com.openai.chatgpt"
    - "com.android.chrome"
    - "com.follow.clash"
    - "com.google.android.inputmethod.latin"
    - "com.android.vending"
    - "com.google.android.gms"
    - "com.google.android.gsf"
    - "ai.x.grok"
    - "com.google.android.keep"
    - "me.weishu.kernelsu"
    - "a.forevergreat.mihomoroot"
    - "com.mixplorer"
    - "com.piyush.music"
    - "com.microsoft.office.outlook"
    - "com.github.pacalini.pica_comic"
    - "com.pikcloud.pikpak"
    - "me.ash.reader"
    - "io.github.chsbuffer.revancedxposed"
    - "ru.dahl.messenger"
    - "com.termux"
    - "org.telegram.group"
    - "com.google.android.youtube"
    - "com.google.android.apps.youtube.music"
    - "com.binance.dev"
    - "im.fdx.v2ex"
    - "com.google.android.apps.photos"
    - "org.adaway"


dns:
  enable: true
  cache-algorithm: lru
  prefer-h3: false
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - geosite:cn
    - geosite:private
  use-hosts: false
  use-system-hosts: true
  default-nameserver:
    - tls://1.12.12.12:853
    - tls://223.5.5.5:853
  nameserver:
    - https://dns.alidns.com/dns-query#h3=true
    - https://doh.pub/dns-query

rules:
  - GEOSITE,category-ads-all,REJECT
  - IP-CIDR,0.0.0.0/32,REJECT,no-resolve

  - GEOSITE,cn,DIRECT
  - GEOSITE,googlefcm,DIRECT
  - GEOSITE,private,DIRECT
  - GEOIP,cn,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve

  - GEOSITE,CATEGORY-AI-!CN,🧠人工智能🧠

  - GEOSITE,category-cryptocurrency,🪙加密货币🪙

  - GEOSITE,youtube,🌍国外媒体🌍

  - MATCH,📌节点选择📌


proxy-groups:
  - name: 📌节点选择📌
    type: select
    url: https://www.google.com
    expected-status: 200
    #icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Dark/Speedtest.png
    interval: 300
    timeout: 2000
    max-failed-times: 3
    proxies:
      - ⚡自动选择⚡
      - ⚖️负载均衡⚖️
      - 🇯🇵日本节点🇯🇵
      - 🇭🇰香港节点🇭🇰
      - 🇺🇸美国节点🇺🇸

  - name: 🧠人工智能🧠
    type: url-test
    url: https://chatgpt.com/
    expected-status: 200
    exclude-filter: 订阅|到期|官网|剩余|RU|俄罗斯|🇷🇺 #|HK|香港|🇭🇰   #|US|美国|🇺🇸
    #icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Dark/Bot.png
    interval: 300
    timeout: 2000
    max-failed-times: 3
    tolerance: 50
    proxies: []

  - name: 🌍国外媒体🌍
    type: load-balance
    strategy: consistent-hashing
    exclude-filter: 订阅|到期|官网|剩余|RU|俄罗斯|🇷🇺|KR|韩国|🇰🇷  #|VN|越南|🇻🇳|MY|马来西亚|🇲🇾|🇷🇺
    #icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Dark/YouTube_Music.png
    interval: 300
    timeout: 2000
    max-failed-times: 3
    tolerance: 50
    proxies: []

  - name: 🪙加密货币🪙
    type: url-test
    url: https://api.binance.com/api/v3/ping
    expected-status: 200
    exclude-filter: 订阅|到期|官网|剩余|RU|俄罗斯|🇷🇺|CA|加拿大|🇨🇦 #|US|美国|🇺🇸
    #icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Dark/Available_Alt.png
    interval: 300
    timeout: 2000
    max-failed-times: 3
    tolerance: 50
    proxies: []

  - name: ⚡自动选择⚡
    type: url-test
    url: https://www.google.com
    expected-status: 200
    exclude-filter: 订阅|到期|官网|剩余|RU|俄罗斯|🇷🇺|KR|韩国|🇰🇷
    #icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Dark/Speedtest.png
    interval: 300
    timeout: 2000
    max-failed-times: 3
    tolerance: 50
    proxies: []

  - name: 🇯🇵日本节点🇯🇵
    type: url-test
    url: https://www.google.com
    expected-status: 200
    filter: JP|日本|🇯🇵
    #icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Dark/Japan.png
    interval: 300
    timeout: 2000
    max-failed-times: 3
    tolerance: 50
    proxies: [ ]

  - name: 🇭🇰香港节点🇭🇰
    type: url-test
    url: https://www.google.com
    expected-status: 200
    filter: HK|香港|🇭🇰
    #icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Dark/Hong_Kong.png
    interval: 300
    timeout: 2000
    max-failed-times: 3
    tolerance: 50
    proxies: [ ]

  - name: 🇺🇸美国节点🇺🇸
    type: url-test
    url: https://www.google.com
    expected-status: 200
    filter: US|美国|🇺🇸
    #icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Dark/United_States.png
    interval: 300
    timeout: 2000
    max-failed-times: 3
    tolerance: 50
    proxies: [ ]

  - name: ⚖️负载均衡⚖️
    type: load-balance
    strategy: consistent-hashing
    url: https://www.google.com
    expected-status: 200
    exclude-filter: 订阅|到期|官网|剩余|RU|俄罗斯|🇷🇺|KR|韩国|🇰🇷
    #icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Dark/Speedtest.png
    interval: 300
    timeout: 2000
    max-failed-times: 3
    tolerance: 50
    proxies: [ ]


